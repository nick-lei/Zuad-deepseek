name: Check Plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify Tracked Build
        run: git diff --exit-code -- lib/
